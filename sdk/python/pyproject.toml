[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wrapperguard-sdk"
version = "0.2.0"
description = "Explicit, local report adapters for WrapperGuard provider API 1"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wrapperguard-sdk = "wrapperguard_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wrapperguard_sdk = ["rules/*.yml"]
