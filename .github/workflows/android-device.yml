name: Android device acceptance

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Build owned Android acceptance APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Provision Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Ensure the explicitly selected Android build SDK is installed
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build the owned acceptance APK
        run: gradle -p examples/android-acceptance --no-daemon --max-workers=2 :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-owned-test-apk
          path: examples/android-acceptance/app/build/outputs/apk/debug/app-debug.apk

  android-device:
    name: Android 16 emulator launch and HTTP audit
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Provision Android command-line tools and emulator
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools emulator'
          log-accepted-android-sdk-licenses: 'false'
      - uses: actions/download-artifact@v4
        with:
          name: android-owned-test-apk
          path: android-apk
      - name: Install the integration SDK
        run: python -m pip install ./sdk/python
      - name: Provision an isolated Android 16 virtual device
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          df -h
          sdkmanager 'system-images;android-36;aosp_atd;x86_64'
          echo no | avdmanager create avd --name wrapperguard-acceptance --package 'system-images;android-36;aosp_atd;x86_64' --device pixel_6
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd wrapperguard-acceptance -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
      - name: Test real device runtime, accessibility tree and SDK response audit
        run: |
          python scripts/android-device-acceptance.py --adb "$ANDROID_SDK_ROOT/platform-tools/adb" --serial emulator-5554 --apk android-apk/app-debug.apk --output "$RUNNER_TEMP/android-evidence" --sdk-python "$(command -v python)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-evidence
          path: |
            ${{ runner.temp }}/android-evidence/
            ${{ runner.temp }}/emulator.log
