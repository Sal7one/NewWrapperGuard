name: Android device acceptance

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-device:
    name: Android 16 emulator build, launch and HTTP audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Ensure the explicitly selected Android build SDK is installed
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build the owned acceptance APK and install the SDK
        run: |
          gradle -p examples/android-acceptance --no-daemon --max-workers=2 :app:assembleDebug
          python -m pip install ./sdk/python
      - name: Provision an isolated Android 16 virtual device
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager 'system-images;android-36;google_apis;x86_64'
          echo no | avdmanager create avd --name wrapperguard-acceptance --package 'system-images;android-36;google_apis;x86_64' --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -avd wrapperguard-acceptance -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
      - name: Test real device runtime, accessibility tree and SDK response audit
        run: |
          python scripts/android-device-acceptance.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --apk examples/android-acceptance/app/build/outputs/apk/debug/app-debug.apk --output "$RUNNER_TEMP/android-evidence" --sdk-python "$(command -v python)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-evidence
          path: |
            ${{ runner.temp }}/android-evidence/
            ${{ runner.temp }}/emulator.log
            examples/android-acceptance/app/build/outputs/apk/debug/app-debug.apk
