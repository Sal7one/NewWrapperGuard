name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  gradle:
    name: Gradle build + tests + parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test all modules
        run: ./gradlew build
      - name: Build plugin zip
        run: ./gradlew :wrapperguard-intellij:buildPlugin
      - name: Scanner parity (TS vs Kotlin) + hostile-input checks
        run: |
          ./gradlew :wrapperguard-cli:installDist -q
          cd vscode-extension
          npm ci
          npm run compile
          node scripts/parity.js "$GITHUB_WORKSPACE/old_project/test-samples" "$GITHUB_WORKSPACE"
          node scripts/hardening.js
      - name: VS Code unit tests
        working-directory: vscode-extension
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: wrapperguard-plugin
          path: wrapperguard-intellij/build/distributions/*.zip

  vscode:
    name: VS Code extension compile + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
