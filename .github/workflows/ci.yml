name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  gradle:
    name: Gradle build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test all modules
        run: ./gradlew build
      - name: Build plugin zip
        run: ./gradlew :wrapperguard-intellij:buildPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: wrapperguard-plugin
          path: wrapperguard-intellij/build/distributions/*.zip

  vscode:
    name: VS Code extension compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run compile
