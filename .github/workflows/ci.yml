name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Gradle build + tests + parity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reserve disk for minimum build SDK and verifier
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build, test and package all JVM modules
        run: ./gradlew build :wrapperguard-cli:installDist :wrapperguard-cli:distZip :wrapperguard-intellij:buildPlugin
      - name: Verify IntelliJ binary compatibility
        run: ./gradlew :wrapperguard-intellij:verifyPlugin
      - name: Installed CLI and provider protocol smoke
        run: |
          python3 scripts/provider-smoke.py
          python3 scripts/provider-conformance.py --python "$(command -v python)"
      - name: Installed integration SDK through the JVM host
        run: |
          python -m pip install ./sdk/python
          python scripts/sdk-smoke.py --sdk-python "$(command -v python)"
      - name: Scanner parity (TS vs Kotlin) + hostile-input checks
        run: |
          cd vscode-extension
          npm ci
          npm run compile
          node scripts/parity.js "$GITHUB_WORKSPACE/test-fixtures/scanner" "$GITHUB_WORKSPACE"
          node scripts/hardening.js
          node scripts/sdk-smoke.js --sdk-python "$(command -v python)"
          node scripts/provider-conformance.js --python "$(command -v python)"
      - name: VS Code unit tests
        working-directory: vscode-extension
        run: npm test
      - name: Package VS Code for cross-distribution review
        working-directory: vscode-extension
        run: npm run package
      - name: Distribution inventory regressions
        run: python -m unittest discover -s scripts/tests -p test_distribution_audit.py -v
      - name: Audit actual packaged runtime closure, licenses and identical SDKs
        run: python scripts/distribution-audit.py --output "$RUNNER_TEMP/distribution-audit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-runtime-audit
          path: ${{ runner.temp }}/distribution-audit/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: wrapperguard-plugin
          path: wrapperguard-intellij/build/distributions/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-results
          path: '**/build/test-results/test/*.xml'

  vscode:
    name: VS Code extension compile + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run hardening
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: wrapperguard-vscode
          path: vscode-extension/*.vsix

  integration-sdk:
    name: Controlled integration SDK (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install SDK and test tools
        run: python -m pip install ./sdk/python bandit==1.9.4 jsonschema==4.25.1
      - name: Build and install the GUI-bundled SDK wheel
        if: matrix.python == '3.12'
        run: |
          python scripts/build-sdk.py
          python -m pip install --force-reinstall --no-deps build/sdk/wrapperguard_sdk-0.4.0-py3-none-any.whl
      - name: SDK and report adapter regressions
        run: python -m unittest discover -s sdk/python/tests -v
      - name: Integration schemas and documented profiles
        run: python scripts/validate-integration-profiles.py
      - name: Real Bandit through the installed SDK
        run: python scripts/sdk-bandit-smoke.py --sdk-python "$(command -v python)" --bandit "$(command -v bandit)"
      - name: Real Kotlin and Java source analysis
        if: matrix.python == '3.12'
        run: |
          python -m pip install semgrep==1.181.0
          python scripts/sdk-semgrep-smoke.py --sdk-python "$(command -v python)" --semgrep "$(command -v semgrep)"
